<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - AI Convo Cast</title>
  <meta name="description" content="Contact AI Convo Cast with feedback, questions, and partnership inquiries.">
  <meta name="robots" content="index,follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101820">
  <meta name="author" content="AI Convo Cast">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src https://anchor.fm https://*.cloudfront.net https://*.spotify.com; connect-src 'self' https://formspree.io; form-action https://formspree.io; base-uri 'none'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="canonical" href="https://aiconvocast.com/contact.html">
  <link rel="icon" type="image/jpeg" href="/ai-convo-cast-logo.jpg">
  <link rel="apple-touch-icon" href="/ai-convo-cast-logo.jpg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <script src="/main.js" defer></script>
  <script src="/contact.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="header">
    <nav class="nav" aria-label="Main navigation">
      <a href="/" class="brand" aria-label="AI Convo Cast home">
        <img src="/ai-convo-cast-logo.jpg" alt="" width="36" height="36">
        <span>AI Convo Cast</span>
      </a>
      <div class="nav-links">
        <a href="/episodes.html" class="nav-link">Episodes</a>
        <a href="/contact.html" class="nav-link nav-link-active">Contact</a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <section class="page-intro">
      <p class="eyebrow">Say hello</p>
      <h1>Contact</h1>
      <p>Send feedback, story ideas, corrections, or partnership notes.</p>
    </section>

    <section class="contact-section" aria-label="Contact form">
      <form id="contact-form" class="contact-form" action="https://formspree.io/f/mnqewqzv" method="POST" autocomplete="on">
        <input type="hidden" name="data-form" value="contact-aiconvocast">
        <div class="form-row">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required maxlength="60" autocomplete="name">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required maxlength="80" autocomplete="email">
        </div>
        <div class="form-row">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required maxlength="120" autocomplete="off">
        </div>
        <div class="form-row">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required maxlength="1000"></textarea>
        </div>
        <button type="submit" class="cta-btn">Send Message</button>
      </form>
      <p id="form-status" class="status-message" role="status" tabindex="-1" hidden></p>
      <p>Prefer email? <a href="mailto:AIConvoCast@gmail.com">AIConvoCast@gmail.com</a></p>
    </section>
  </main>

  <footer class="footer">
    <span>&copy; <span id="year">{{YEAR}}</span> AI Convo Cast</span>
    <a href="/privacy.html">Privacy</a>
    <a href="https://anchor.fm/s/101530384/podcast/rss" rel="noopener noreferrer">RSS Feed</a>
    <a href="https://github.com/AIConvoCast/AIConvoCast" rel="noopener noreferrer">GitHub</a>
  </footer>
</body>
</html>
