# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - '*.html'
      - '*.css'
      - 'main.js'
      - 'contact.js'
      - 'build_site.py'
      - 'test_site.py'
      - 'check_site.py'
      - 'ai-convo-cast-logo.jpg'
      - 'manifest.json'
      - 'CNAME'
      - '.github/workflows/static.yml'
  schedule:
    - cron: '17 */2 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify site generation
        run: python -m unittest test_site -v
      - name: Build current episodes and search metadata
        run: python build_site.py --output public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Enable HTTPS when GitHub finishes certificate issuance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python check_site.py --enable-https
