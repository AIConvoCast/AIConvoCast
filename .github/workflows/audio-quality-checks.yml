name: Audio Quality Checks

on:
  push:
    branches: [main]
    paths:
      - 'audio_mastering.py'
      - 'ai_podcast_pipeline_for_cursor.py'
      - 'test_google_audio_quality.py'
      - 'google_pronunciations.py'
      - 'podcast_email.py'
      - 'service_retry.py'
      - 'local_artifacts.py'
      - 'news_research.py'
      - 'test_pipeline_recovery.py'
      - 'test_news_research.py'
      - 'test_podcast_email.py'
      - 'test_google_pronunciations.py'
      - 'check_scheduled_podcast.py'
      - 'test_scheduled_podcast.py'
      - 'requirements.txt'
      - '.github/workflows/audio-quality-checks.yml'
      - '.github/workflows/ai_podcast_pipeline.yml'
      - '.github/workflows/manual_ai_podcast_pipeline.yml'
      - '.github/workflows/ai_podcast_pipeline_v2.yml'
      - 'podcast_v2/**'
      - 'test_podcast_v2.py'
  pull_request:
    paths:
      - 'audio_mastering.py'
      - 'ai_podcast_pipeline_for_cursor.py'
      - 'test_google_audio_quality.py'
      - 'google_pronunciations.py'
      - 'podcast_email.py'
      - 'service_retry.py'
      - 'local_artifacts.py'
      - 'news_research.py'
      - 'test_pipeline_recovery.py'
      - 'test_news_research.py'
      - 'test_podcast_email.py'
      - 'test_google_pronunciations.py'
      - 'check_scheduled_podcast.py'
      - 'test_scheduled_podcast.py'
      - 'requirements.txt'
      - '.github/workflows/audio-quality-checks.yml'
      - '.github/workflows/ai_podcast_pipeline.yml'
      - '.github/workflows/manual_ai_podcast_pipeline.yml'
      - '.github/workflows/ai_podcast_pipeline_v2.yml'
      - 'podcast_v2/**'
      - 'test_podcast_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-quality:
    name: Verify podcast audio on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify Python modules
        run: |
          python -m py_compile ai_podcast_pipeline_for_cursor.py audio_mastering.py google_pronunciations.py test_google_pronunciations.py test_google_audio_quality.py check_scheduled_podcast.py test_scheduled_podcast.py
          python -c "import audio_mastering; from google.cloud import storage, texttospeech; import pandas, gspread, openai, anthropic"

      - name: Verify audio processing
        run: python -m unittest test_google_audio_quality test_google_pronunciations test_podcast_email test_pipeline_recovery test_news_research test_podcast_v2 -v

      - name: Verify scheduled run decisions
        run: python -m unittest test_scheduled_podcast -v

      - name: Verify GitHub workflow history access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from check_scheduled_podcast import github_api_get
          repository = os.environ['GITHUB_REPOSITORY']
          history = github_api_get(f'/repos/{repository}/actions/workflows/ai_podcast_pipeline_v2.yml/runs', {'event': 'workflow_dispatch', 'per_page': 1})
          assert 'workflow_runs' in history
          print('GitHub workflow history is readable with the Actions token.')
          PY
