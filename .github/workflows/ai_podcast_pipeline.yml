name: Run AI Podcast Pipeline
run-name: ${{ inputs.dry_run && 'Validate Podcast Scheduler' || ((github.event_name == 'schedule' || inputs.scheduled_run) && 'Scheduled AI Podcast Pipeline' || 'Manual AI Podcast Pipeline') }}

permissions:
  contents: read

on:
  schedule:
    # Late fallback only: Google Cloud Scheduler dispatches at 4 p.m. Eastern.
    # 21:17 UTC is after 4 p.m. in both EST and EDT. Duplicate checks apply.
    - cron: '17 21 * * 0-4'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Custom topic for the podcast (optional)'
        required: false
        type: string
      workflow_id:
        description: 'Specific workflow ID to run (optional) - leave blank to use Active Y flag from Workflows tab'
        required: false
        type: string
        default: ''
      force_run:
        description: 'Force run even if no changes detected'
        required: false
        type: boolean
        default: false
      scheduled_run:
        description: 'Automatic scheduler trigger (leave unchecked for a manual run)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate scheduler checks without generating a podcast'
        required: false
        type: boolean
        default: false

# Google dispatches and the native fallback share one automatic run slot.
# A backup must never cancel active podcast generation.
# Manual triggers remain immediate and independent.
concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.scheduled_run) && 'podcast-automatic' || format('podcast-manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  check-schedule:
    name: Check target time and today's runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.history.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check target time and run history
        id: history
        run: python check_scheduled_podcast.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PODCAST_SCHEDULED_RUN: ${{ inputs.scheduled_run && 'true' || 'false' }}

  run-pipeline:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    name: Run AI Podcast Pipeline
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment: production  # Use your GitHub environment
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify audio processing
        run: python -m unittest test_google_audio_quality -v

      - name: Verify email authorization before paid generation
        run: python podcast_email.py --check-auth
        env:
          PODCAST_EMAIL_BACKEND: gmail_api
          GMAIL_OAUTH_TOKEN_B64: ${{ secrets.GMAIL_OAUTH_TOKEN_B64 }}
          PODCAST_SMTP_USERNAME: ${{ secrets.PODCAST_SMTP_USERNAME }}
          PODCAST_SMTP_PASSWORD: ${{ secrets.PODCAST_SMTP_PASSWORD }}

      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDS_JSON }}' > jmio-google-api.json

      - name: Set up environment variables
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> $GITHUB_ENV
          echo "SHARE_SHEET_WITH_EMAIL=${{ secrets.SHARE_SHEET_WITH_EMAIL }}" >> $GITHUB_ENV
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "PODCAST_EMAIL_BACKEND=gmail_api" >> $GITHUB_ENV
          echo "PODCAST_EMAIL_FROM=AIConvoCast@gmail.com" >> $GITHUB_ENV
          echo "PODCAST_EMAIL_TO=ianeoconnell@gmail.com" >> $GITHUB_ENV
          echo "CUSTOM_TOPIC=${{ github.event.inputs.custom_topic || '' }}" >> $GITHUB_ENV
          echo "WORKFLOW_ID=${{ github.event.inputs.workflow_id || '' }}" >> $GITHUB_ENV

      - name: Create .env file
        run: |
          cat > .env << EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}
          SHARE_SHEET_WITH_EMAIL=${{ secrets.SHARE_SHEET_WITH_EMAIL }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Test Environment Variables
        run: |
          python test_env_vars.py
        env:
          GMAIL_OAUTH_TOKEN_B64: ${{ secrets.GMAIL_OAUTH_TOKEN_B64 }}
          PODCAST_SMTP_USERNAME: ${{ secrets.PODCAST_SMTP_USERNAME }}
          PODCAST_SMTP_PASSWORD: ${{ secrets.PODCAST_SMTP_PASSWORD }}
          RESEARCH_SOL_BASELINE_USD: ${{ vars.RESEARCH_SOL_BASELINE_USD }}

      - name: Recheck today's runs immediately before generation
        id: final-check
        run: python check_scheduled_podcast.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PODCAST_SCHEDULED_RUN: ${{ inputs.scheduled_run && 'true' || 'false' }}

      - name: Run AI Podcast Pipeline
        id: run-pipeline
        if: steps.final-check.outputs.should_run == 'true'
        run: |
          echo "Starting AI Podcast Pipeline..."
          echo "Custom Topic: ${{ github.event.inputs.custom_topic || 'None' }}"
          echo "Workflow ID: ${{ github.event.inputs.workflow_id || 'Active Y from Workflows tab' }}"
          echo "Trigger: ${{ github.event_name }}"
          
          # Debug: Check if environment variables are set
          echo "Checking environment variables..."
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "✅ OPENAI_API_KEY is set (length: ${#OPENAI_API_KEY})"
          else
            echo "❌ OPENAI_API_KEY is not set"
          fi
          
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            echo "✅ ELEVENLABS_API_KEY is set (length: ${#ELEVENLABS_API_KEY})"
          else
            echo "❌ ELEVENLABS_API_KEY is not set"
          fi
          
          if [ -n "$SHARE_SHEET_WITH_EMAIL" ]; then
            echo "✅ SHARE_SHEET_WITH_EMAIL is set: $SHARE_SHEET_WITH_EMAIL"
          else
            echo "❌ SHARE_SHEET_WITH_EMAIL is not set"
          fi
          
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "✅ ANTHROPIC_API_KEY is set (length: ${#ANTHROPIC_API_KEY})"
          else
            echo "❌ ANTHROPIC_API_KEY is not set"
          fi
          
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "✅ GEMINI_API_KEY is set (length: ${#GEMINI_API_KEY})"
          else
            echo "❌ GEMINI_API_KEY is not set"
          fi
          
          python ai_podcast_pipeline_for_cursor.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SHARE_SHEET_WITH_EMAIL: ${{ secrets.SHARE_SHEET_WITH_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_EMAIL_BACKEND: gmail_api
          PODCAST_EMAIL_FROM: AIConvoCast@gmail.com
          PODCAST_EMAIL_TO: ianeoconnell@gmail.com
          GMAIL_OAUTH_TOKEN_B64: ${{ secrets.GMAIL_OAUTH_TOKEN_B64 }}
          PODCAST_SMTP_USERNAME: ${{ secrets.PODCAST_SMTP_USERNAME }}
          PODCAST_SMTP_PASSWORD: ${{ secrets.PODCAST_SMTP_PASSWORD }}
          RESEARCH_SOL_BASELINE_USD: ${{ vars.RESEARCH_SOL_BASELINE_USD }}

      - name: Upload generated audio files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-audio-files-${{ github.run_id }}
          path: |
            generated_mp3/
            *.mp3
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: |
            *.log
            logs/
          retention-days: 30

      - name: Cleanup generated files
        if: always()
        run: |
          rm -rf generated_mp3/
          rm -f *.mp3
          rm -f jmio-google-api.json
          rm -f .env

      - name: Notify on success
        if: success() && steps.run-pipeline.outcome == 'success'
        run: |
          echo "✅ AI Podcast Pipeline completed successfully!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Check the generated-audio-files-${{ github.run_id }} artifact for output."

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ AI Podcast Pipeline failed!"
          echo "Run ID: ${{ github.run_id }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Check the pipeline-logs-${{ github.run_id }} artifact for details."
