name: Intro and Outro V2

# Inspects or re-records the episode intro and outro with the narration voice.
#   inspect: reports each current clip's length, loudness, pauses, transcript and
#            whether it sits over music, the original ElevenLabs generation if it
#            is still in history, and the files at the top of the bucket. With
#            the show's own track as the music, also describes the track and
#            where the current clips' music sits in it. Read-only.
#   check:   joins each episode workflow's intro, the latest saved narration
#            and its outro exactly as an episode's merge step does, reports
#            every part and the join (length, loudness, peaks), fails if
#            anything is off, and attaches the opening and ending. No uploads
#            or email.
#   history: looks for the music that older intros and outros used: stored
#            versions of Intro.mp3/Outro.mp3 and the start of older episodes.
#            Read-only.
#   record:  narrates the text in podcast_v2/intro_outro.json with the episode
#            voice and model, makes a voice-only and a with-music version of
#            each clip (over a synth bed from podcast_v2/synth_bed.py or the
#            show's own track, saved once and reused), levels them to the
#            current intro, saves them to Cloud Storage under new names (the old
#            files are untouched), attaches them and a review MP3 to the run, and
#            emails the review file when send_email is on. Episodes keep the
#            current clips until workflow.json and topic_workflow.json name a
#            new one, and it never overwrites a clip they use.
# music_link: a link to the show's own track (a Google Drive share link works),
#            needed until record has saved the track to Cloud Storage. The repo
#            and its logs are public, so the link is masked and never printed.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect (read-only), record (makes and saves new candidates) or check (test-joins an episode)'
        required: true
        type: choice
        options:
          - inspect
          - record
          - check
          - history
        default: inspect
      send_email:
        description: 'With record, email the review file to the usual episode address'
        required: false
        type: boolean
        default: true
      music_link:
        description: 'Optional link to your own music track (e.g. a Google Drive share link); kept out of the logs'
        required: false
        type: string
        default: ''

concurrency:
  group: intro-outro-v2
  cancel-in-progress: false

jobs:
  intro-outro:
    name: Intro and outro (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDS_JSON }}' > jmio-google-api.json

      # Read from the event file, not ${{ }}, so the link never shows in the printed script.
      - name: Hide the music link
        run: |
          link=$(jq -r '.inputs.music_link // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$link" ]; then
            echo "::add-mask::$link"
            for part in $(grep -oE '[A-Za-z0-9_-]{16,}' <<< "$link"); do echo "::add-mask::$part"; done
            echo "MUSIC_LINK=$link" >> "$GITHUB_ENV"
          fi

      - name: Intro and outro
        run: python podcast_v2/intro_outro.py --${{ inputs.action }} ${{ inputs.action == 'record' && inputs.send_email && '--email' || '' }}
        env:
          # The shared pipeline module checks for both keys when it loads.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PODCAST_EMAIL_BACKEND: gmail_api
          PODCAST_EMAIL_FROM: AIConvoCast@gmail.com
          PODCAST_EMAIL_TO: ianeoconnell@gmail.com
          GMAIL_OAUTH_TOKEN_B64: ${{ secrets.GMAIL_OAUTH_TOKEN_B64 }}

      - name: Attach music traces
        if: ${{ inputs.action == 'history' }}
        uses: actions/upload-artifact@v4
        with:
          name: intro-outro-music-${{ github.run_id }}
          path: generated_mp3/history/*.mp3
          retention-days: 30
          if-no-files-found: warn

      - name: Attach the episode opening and ending
        if: ${{ always() && inputs.action == 'check' }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-check-${{ github.run_id }}
          path: generated_mp3/episode_check/*.mp3
          retention-days: 14
          if-no-files-found: warn

      - name: Attach new clips
        if: ${{ inputs.action == 'record' }}
        uses: actions/upload-artifact@v4
        with:
          name: intro-outro-${{ github.run_id }}
          path: generated_mp3/intro_outro/*.mp3
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf generated_mp3/ jmio-google-api.json
