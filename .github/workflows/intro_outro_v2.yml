name: Intro and Outro V2

# Inspects or re-records the episode intro and outro with the narration voice.
#   inspect: reports each current clip's length, loudness, pauses, transcript and
#            whether it sits over music, the original ElevenLabs generation if it
#            is still in history, and the files at the top of the bucket.
#            Read-only.
#   record:  narrates the text in podcast_v2/intro_outro.json with the episode
#            voice and model, makes a voice-only and a light-synth-music version
#            of each clip (the light synth bed is made once by
#            podcast_v2/synth_bed.py and reused), levels them to the current
#            intro, saves them to Cloud
#            Storage under new names (the old files are untouched), attaches
#            them and a review MP3 to the run, and emails the review file when
#            send_email is on. Episodes keep the current clips until
#            workflow.json and topic_workflow.json name a new one.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect (read-only) or record (makes and saves the new clips)'
        required: true
        type: choice
        options:
          - inspect
          - record
        default: inspect
      send_email:
        description: 'With record, email the review file to the usual episode address'
        required: false
        type: boolean
        default: true

concurrency:
  group: intro-outro-v2
  cancel-in-progress: false

jobs:
  intro-outro:
    name: Intro and outro (${{ inputs.action }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create Google credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDS_JSON }}' > jmio-google-api.json

      - name: Intro and outro
        run: python podcast_v2/intro_outro.py --${{ inputs.action }} ${{ inputs.action == 'record' && inputs.send_email && '--email' || '' }}
        env:
          # The shared pipeline module checks for both keys when it loads.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PODCAST_EMAIL_BACKEND: gmail_api
          PODCAST_EMAIL_FROM: AIConvoCast@gmail.com
          PODCAST_EMAIL_TO: ianeoconnell@gmail.com
          GMAIL_OAUTH_TOKEN_B64: ${{ secrets.GMAIL_OAUTH_TOKEN_B64 }}

      - name: Attach new clips
        if: ${{ inputs.action == 'record' }}
        uses: actions/upload-artifact@v4
        with:
          name: intro-outro-${{ github.run_id }}
          path: generated_mp3/intro_outro/*.mp3
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: rm -rf generated_mp3/ jmio-google-api.json
